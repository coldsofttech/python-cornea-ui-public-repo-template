[defaults]
profiles = ["python", "node"]
risk = "safe"

[clean]
# Hypothesis (used by Schemathesis) keeps a local example database; it is opt-in because it holds
# regression seeds, which this template does not rely on.
enable = ["python.hypothesis"]
# Exclusions always win over cleanup rules. Keep the uv environment and installed UI dependencies
# between commits.
exclude = [".venv/", "node_modules/"]

[hook]
quiet = true

# Schemathesis has no built-in rule. Its cache is rebuilt on the next contract test run.
[[rule]]
id = "custom.schemathesis"
paths = [".schemathesis/"]
requires = ["pyproject.toml"]
profile = "python"
description = "Schemathesis cache"
