# Workspace root: not published itself. The distributions live in packages/ (core -> example-package,
# cli -> example-cli, api -> example-api, ui -> example-ui).
[tool.uv.workspace]
members = ["packages/core", "packages/cli", "packages/api", "packages/ui"]

[tool.uv.sources]
example-package = { workspace = true }
example-cli = { workspace = true }
example-api = { workspace = true }
example-ui = { workspace = true }

[dependency-groups]
dev = [
  "example-package",
  "example-cli",
  "example-api",
  "example-ui",
  "cornea-shell[proxy]>=0.1.1",
  "httpx>=0.28.1",
  "mypy>=1.13",
  "pip-licenses>=5",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
  "schemathesis>=4.32.7",
]
installer = [
  "hatchling>=1.33.0",
  "pyinstaller>=6.22.3",
]

[tool.ruff]
line-length = 100
src = [
  "packages/core/src",
  "packages/cli/src",
  "packages/api/src",
  "packages/ui/src",
  "packages/core/tests",
  "packages/cli/tests",
  "packages/api/tests",
  "packages/ui/tests",
  "packages/docker/tests",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["example_package", "example_cli", "example_api", "example_ui"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "S105", "S106", "S603"]  # assert, subprocess and fake passwords are fine in tests
"scripts/**" = ["S603", "S607", "T201"]  # scripts call the trusted gh CLI and print progress
"installer/scripts/**" = ["S603", "S607", "T201"]  # scripts call trusted tools and print progress
"packages/*/scripts/**" = ["T201"]  # scripts print what they did

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "packages/core/src:packages/cli/src:packages/api/src:packages/ui/src"
files = ["packages/core/src", "packages/cli/src", "packages/api/src", "packages/ui/src"]

[tool.pyright]
extraPaths = [
  "packages/core/src",
  "packages/cli/src",
  "packages/api/src",
  "packages/ui/src",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration' --strict-markers --cov=example_package --cov=example_cli --cov=example_api --cov=example_ui --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: slower end-to-end tests, run in CI but not by default or in pre-commit"]

[tool.coverage.run]
branch = true
