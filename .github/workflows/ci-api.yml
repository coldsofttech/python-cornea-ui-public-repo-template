name: CI API

# packages/api: lint, tests, integration tests and build. Called by ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  api-lint:
    name: api lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
      - name: Lint
        uses: ./.github/actions/lint-python
        with:
          path: packages/api
      - name: Check the OpenAPI document is up to date
        run: |
          uv run python packages/api/scripts/export_openapi.py
          git diff --exit-code packages/api/docs/openapi.json

  api-test:
    name: api test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.15"]
        include:
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest # Apple silicon
            python-version: "3.15"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/run-pytest
        with:
          package: api
          python-version: ${{ matrix.python-version }}

  api-int-test:
    name: api int-test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.15"]
        include:
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest # Apple silicon
            python-version: "3.15"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Run integration tests
        uses: ./.github/actions/run-pytest
        with:
          package: api
          python-version: ${{ matrix.python-version }}
          integration: "true"

  api-build:
    name: api build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Read project names
        uses: ./.github/actions/project-info
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          sync: "false"
      - name: Build the package
        run: uv build --package example-api
      - name: Check the package metadata
        run: uvx twine check --strict dist/*
      - name: Check the package holds the API only
        run: |
          unzip -l dist/*.whl > wheel.txt
          grep -q " ${API_PACKAGE}/" wheel.txt
          if grep -E " (${CORE_PACKAGE}|${CLI_PACKAGE}|${UI_PACKAGE})/" wheel.txt; then
            echo "the API wheel must hold the API only"; exit 1
          fi
