name: CI Installer

# The full setup: the command line and the window in one installer. Builds the Windows setup, and
# the deb and rpm packages on Linux, from the frontend build made by ci-ui.yml. Called by ci.yml
# once the cli and ui checks have passed.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  installer-windows:
    name: full installer (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Read project names
        uses: ./.github/actions/project-info
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.15"
          sync-args: --locked --all-packages --group installer
      - name: Download the UI build
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ${{ env.UI_DIR }}/dist/
      - name: Install installer tools
        uses: ./.github/actions/install-installer-tools
      - name: Build the installer and smoke test the executables
        run: uv run --no-sync python installer/scripts/build.py --smoke
      - name: Test the Windows setup
        uses: ./.github/actions/test-windows-installer
      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-windows
          path: |
            dist/installer/*.exe
            dist/installer/*.json
            dist/installer/*.zip
          retention-days: 7
          if-no-files-found: error

  # Builds the deb and rpm packages (x86_64), starts the frozen programs, then installs, runs and
  # removes the result.
  installer-linux:
    name: full installer (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Read project names
        uses: ./.github/actions/project-info
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.15"
          sync-args: --locked --all-packages --group installer
      - name: Download the UI build
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ${{ env.UI_DIR }}/dist/
      - name: Install installer tools
        uses: ./.github/actions/install-installer-tools
      - name: Build the installer and smoke test the executables
        run: uv run --no-sync python installer/scripts/build.py --smoke
      - name: Test the Linux packages
        uses: ./.github/actions/test-linux-packages
      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-linux
          path: |
            dist/installer/*.deb
            dist/installer/*.rpm
          retention-days: 7
          if-no-files-found: error
