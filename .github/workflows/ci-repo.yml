name: CI repo

# Everything outside packages/: installer files, docs, workflows and the root files.
# Called by ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  repo-lint:
    name: repo lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
      - name: Ruff check
        run: uv run ruff check installer
      - name: Ruff format
        run: uv run ruff format --check installer
      - name: Run pre-commit hooks
        env:
          SKIP: pytest-core,pytest-cli,pytest-api,pytest-ui # covered by the test jobs across all Python versions
        run: git ls-files -z . ':(exclude)packages' | xargs -0 uvx pre-commit run --files
