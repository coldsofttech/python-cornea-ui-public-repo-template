name: Audit API

# packages/api: known vulnerabilities in the locked dependencies. Called by audit.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  api-audit:
    name: api audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Audit
        uses: ./.github/actions/audit-python
        with:
          package: example-api
