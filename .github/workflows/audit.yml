name: Audit

# Checks locked dependencies for known vulnerabilities. Dependency review only covers
# pull requests, so this catches advisories published against dependencies already in use.
# Calls one workflow per package (audit-core, audit-cli, audit-api, audit-ui) and one for the
# workspace root (audit-repo).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [uv.lock, '**/package-lock.json']

permissions:
  contents: read

jobs:
  core:
    uses: ./.github/workflows/audit-core.yml

  cli:
    uses: ./.github/workflows/audit-cli.yml

  api:
    uses: ./.github/workflows/audit-api.yml

  ui:
    uses: ./.github/workflows/audit-ui.yml

  repo:
    uses: ./.github/workflows/audit-repo.yml
