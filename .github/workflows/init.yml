name: Init

# Run once from the Actions tab in a repository created from the template.
# Replaces the template's owner and repository name, renames the example packages and commands to
# your name (scripts/init_template.py), regenerates the lock file and generated docs, then opens a
# pull request. The other workflows read their names from pyproject.toml, so they need no renaming.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Short lowercase name for packages and commands, e.g. acme (acme_cli, acme-cli, ACME_API_)
        required: true
        type: string
      title:
        description: Display name of the app, e.g. Acme Studio
        required: true
        type: string
      pyd_support:
        description: >-
          Publish compiled extension modules (.pyd on Windows, .so elsewhere) to PyPI instead of
          plain .py sources: wheels only, no sdist. The installers are not affected.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  init:
    if: github.repository != 'coldsofttech/python-cornea-ui-public-repo-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Replace placeholders
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          git ls-files -z -- . \
            ':(exclude).github/workflows' ':(exclude)LICENSE' ':(exclude).pre-commit-config.yaml' \
            | xargs -0 grep -lZ -e coldsofttech -e public-repo-template \
            | xargs -0 -r sed -i \
                -e "s|coldsofttech/python-cornea-ui-public-repo-template|$REPO|g" \
                -e "s|python-cornea-ui-public-repo-template|$NAME|g" \
                -e "s|coldsofttech|$OWNER|g"

      - name: Rename the example packages and commands
        env:
          APP_NAME: ${{ inputs.name }}
          APP_TITLE: ${{ inputs.title }}
        run: python3 scripts/init_template.py --name "$APP_NAME" --title "$APP_TITLE"

      - name: Enable compiled (.pyd) builds
        if: inputs.pyd_support
        run: |
          cat > setup.py <<'PY'
          """Build script. With PYD_BUILD=1 every module of the published packages except __init__.py
          and __main__.py is compiled with Cython into an extension module (.pyd on Windows, .so
          elsewhere), its .py source is left out of the wheel, and .pyi type stubs generated by
          mypy's stubgen ship in its place. Without it the packages build as plain Python, so local
          development, editable installs, coverage and the installers are unaffected.

          Which packages are published comes from [tool.setuptools.packages.find] in pyproject.toml.
          """

          import os
          import shutil
          import tomllib
          from pathlib import Path

          from setuptools import Extension, find_packages, setup
          from setuptools.command.build_py import build_py as _build_py

          COMPILE = os.environ.get("PYD_BUILD") == "1"
          SRC = Path("src")
          # Stay plain Python: packages need __init__.py, and python -m needs a source __main__.py.
          KEEP = {"__init__.py", "__main__.py"}

          settings = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          find = settings["tool"]["setuptools"]["packages"]["find"]
          PACKAGES = find_packages(where=str(SRC), include=find.get("include", ["*"]))


          def compiled_modules():
              for package in PACKAGES:
                  folder = SRC.joinpath(*package.split("."))
                  for path in sorted(folder.glob("*.py")):
                      if path.name not in KEEP:
                          yield package, path


          class build_py(_build_py):
              def build_module(self, module, module_file, package):
                  if COMPILE and Path(module_file).name not in KEEP:
                      return None  # shipped as a compiled module instead
                  return super().build_module(module, module_file, package)

              def run(self):
                  super().run()
                  if COMPILE:
                      stubs = Path("build/stubs")
                      shutil.rmtree(stubs, ignore_errors=True)
                      from mypy.stubgen import main as stubgen

                      roots = sorted({package.split(".")[0] for package in PACKAGES})
                      stubgen(["-o", str(stubs), *(str(SRC / root) for root in roots)])
                      shutil.copytree(stubs, self.build_lib, dirs_exist_ok=True)


          ext_modules = []
          if COMPILE:
              from Cython.Build import cythonize

              ext_modules = cythonize(
                  [
                      Extension(f"{package}.{path.stem}", [path.as_posix()])
                      for package, path in compiled_modules()
                  ],
                  build_dir="build/cython",
                  compiler_directives={
                      "language_level": "3",
                      "annotation_typing": False,  # keep Python's runtime annotation semantics
                      "emit_code_comments": False,
                  },
              )

          setup(ext_modules=ext_modules, cmdclass={"build_py": build_py})
          PY

          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          scripts = tomllib.loads(text)["project"]["scripts"]
          cli_module = next(iter(scripts.values())).split(":")[0]  # e.g. example_cli.cli
          cli_package = cli_module.split(".")[0]

          version = re.search(r'\[tool\.hatch\.version\]\npath = "src/(\w+)/__init__\.py"\n', text)
          wheel = re.search(r'\[tool\.hatch\.build\.targets\.wheel\]\npackages = \[([^\]]*)\]\n', text)
          assert version and wheel, "hatch version/wheel settings not found in pyproject.toml"
          package = version.group(1)
          include = ", ".join(
              f'"{name}", "{name}.*"' for name in re.findall(r'"src/(\w+)"', wheel.group(1))
          )

          def swap(old, new):
              global text
              assert old in text, old
              text = text.replace(old, new, 1)

          swap('requires = ["hatchling"]', 'requires = ["setuptools>=77", "Cython>=3.1", "mypy>=1.13"]')
          swap('build-backend = "hatchling.build"', 'build-backend = "setuptools.build_meta"')
          # installer/projectinfo.py still reads this table, so it stays.
          swap(version.group(0), "# Read by installer/projectinfo.py. The build reads [tool.setuptools.dynamic].\n" + version.group(0))
          text = re.sub(r'\[tool\.hatch\.build\.targets\.sdist\]\ninclude = \[[^\]]*\]\n\n', "", text, count=1)
          text = text.replace(" The wheel is built from the sdist, so both\n# list the same two packages.", "")
          swap(
              wheel.group(0),
              f'[tool.setuptools.dynamic]\nversion = {{ attr = "{package}.__version__" }}\n\n'
              f'[tool.setuptools.packages.find]\nwhere = ["src"]\ninclude = [{include}]\n\n'
              '[tool.setuptools.package-data]\n"*" = ["py.typed"]\n\n'
              "# The API and the window need libraries that are not installed here, so each compiled\n"
              "# wheel is tested with the core and command line suites only.\n"
              '[tool.cibuildwheel]\n'
              'build = "cp311-* cp312-* cp313-* cp314-*"\n'
              'environment = { PYD_BUILD = "1" }\n'
              'test-requires = "pytest"\n'
              'test-command = "pytest --noconftest -o addopts= {project}/tests/core {project}/tests/cli"\n',
          )
          path.write_text(text)
          PY

      - name: Read project names
        run: python3 installer/projectinfo.py github

      - name: Regenerate the lock file and the generated docs
        run: |
          uv lock
          uv sync
          uv run typer "$CLI_MODULE" utils docs --name "$CLI_NAME" --output docs/cli-reference.md
          uv run python scripts/export_openapi.py

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          APP_NAME: ${{ inputs.name }}
        run: |
          git rm --quiet scripts/init_template.py TEMPLATE_CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/init-template
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -m "chore: initialize repository from template"
          git push origin chore/init-template
          gh pr create --base "$BASE" --head chore/init-template \
            --title "chore: initialize repository from template" \
            --body "Replaces the template owner and repository name and renames the example packages and commands to \`$APP_NAME\`. Review and merge, then:

          - delete \`.github/workflows/init.yml\`
          - replace the icon in \`src/${UI_PACKAGE}/ui/public/icon.png\`
          - add an email to the author in \`pyproject.toml\` and your contact details in \`CODE_OF_CONDUCT.md\`
          - apply the protections from \`docs/repo-setup.md\`"
