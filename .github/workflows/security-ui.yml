name: Security UI

# packages/ui: static analysis (Semgrep) of the Python window and the React frontend. Called by
# security.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  ui-semgrep:
    name: ui semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Semgrep
        uses: ./.github/actions/semgrep
        with:
          path: packages/ui
          configs: p/python p/javascript p/react p/owasp-top-ten
          category: semgrep-ui
